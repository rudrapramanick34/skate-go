<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline Catalog | Skate Go</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/header-footer.css">
  <style>
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem 5rem 1rem;
    }
    .catalog-header {
      margin-bottom: 2rem;
    }
    .catalog-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--color-text-main, #FFFFFF);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .catalog-subtitle {
      color: var(--color-text-secondary, #BDBDBD);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    /* Filter Toolbar */
    .filter-toolbar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--color-card, #151515);
      border: 1px solid var(--color-card-border, #222222);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    @media (min-width: 768px) {
      .filter-toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }
    .filter-btn {
      background: var(--color-background, #0B0B0B);
      color: var(--color-text-secondary, #BDBDBD);
      border: 1px solid var(--color-card-border, #222222);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--color-primary, #EE0039);
      color: #FFFFFF;
      border-color: var(--color-primary, #EE0039);
    }
    .sort-select {
      background: var(--color-background, #0B0B0B);
      color: var(--color-text-main, #FFFFFF);
      border: 1px solid var(--color-card-border, #222222);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner container">
      <a href="index.html" class="brand-logo" aria-label="Skate Go Home">
        <span class="logo-text">SKATE<span class="logo-accent">GO</span></span>
      </a>

      <nav class="nav-desktop">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link active">Inline Catalog</a>
        <a href="search.html" class="nav-link">Search Gear</a>
      </nav>

      <div class="header-actions">
        <button class="cart-icon-btn" id="cart-toggle-btn" data-action="open-cart" aria-label="View Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-count-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CART DRAWER OVERLAY -->
  <div id="cart-drawer-overlay" class="cart-drawer-overlay">
    <div class="cart-drawer">
      <div class="cart-drawer-header">
        <h2>Your Gear Bag</h2>
        <button id="cart-close-btn" class="close-btn" aria-label="Close Cart">&times;</button>
      </div>
      <div id="cart-drawer-items" class="cart-drawer-items"></div>
      <div class="cart-drawer-footer">
        <div class="subtotal-row">
          <span>Subtotal:</span>
          <span id="cart-drawer-subtotal">₹0</span>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
      </div>
    </div>
  </div>

  <main class="catalog-container">
    <div class="catalog-header">
      <h1 class="catalog-title">Precision Hardware Catalog</h1>
      <p class="catalog-subtitle">High-rebound wheels, ceramic bearings, CNC aluminum chassis, and protective gear.</p>
    </div>

    <div class="filter-toolbar">
      <div class="filter-group" id="category-filters">
        <button class="filter-btn active" data-category="all">All Gear</button>
        <button class="filter-btn" data-category="wheels">Wheels</button>
        <button class="filter-btn" data-category="bearings">Bearings</button>
        <button class="filter-btn" data-category="frames">Frames</button>
        <button class="filter-btn" data-category="protective">Protective</button>
      </div>
      <div>
        <select id="sort-select" class="sort-select">
          <option value="featured">Featured Order</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="catalog-products-grid" class="product-grid">
      <!-- Dynamically generated -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; 2025 Skate Go. High Performance Inline Accessories. India Shipping Only.</p>
      <div style="margin-top:0.5rem;">
        <a href="legal/shipping-policy.html" style="color:#BDBDBD; margin-right:1rem;">Shipping</a>
        <a href="legal/refund-policy.html" style="color:#BDBDBD; margin-right:1rem;">Refunds</a>
        <a href="legal/terms.html" style="color:#BDBDBD;">Terms</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/cart-store.js"></script>
  <script src="assets/js/cart-drawer.js"></script>
  <script src="assets/js/pages/shop.js"></script>
</body>
</html>
